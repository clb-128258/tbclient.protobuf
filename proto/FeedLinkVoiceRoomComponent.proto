syntax = "proto3";

import "FeedContentIcon.proto";
import "FeedContentResource.proto";

message FeedLinkVoiceRoomComponent {
    string title = 1;
    FeedContentIcon icon_url = 2;
    string schema = 3;
    int32 url_type = 4;
    string content1 = 5;
    string content2 = 6;
    repeated string right_imgs = 7;
    string right_content = 8;
    FeedContentIcon right_icon = 9;
    int32 can_enter = 10;
    repeated FeedContentResource del_text = 11;
}
