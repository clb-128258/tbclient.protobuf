syntax = "proto3";

message PbLinkInfo {
    string title = 1;
    string to_url = 2;
    string pic_url = 3;
    string link_from = 4;
    string ext_txt = 5;
    uint32 sort = 6;
    int32 url_type = 7;
    string content1 = 8;
    string content2 = 9;
    repeated string right_imgs = 10;
    string right_content = 11;
    string right_icon = 12;
    int32 can_enter = 13;
    int32 status = 14;
    int64 id = 15;
}
