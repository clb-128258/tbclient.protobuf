syntax = "proto3";

import "FeedKV.proto";
import "FeedbackReason.proto";

message FeedFeedback {
    string type = 1;
    string title = 2;
    string button_text = 3;
    string common_id = 4;
    repeated FeedbackReason dislike = 5;
    string action_type = 6;
    repeated FeedKV business_info = 7;
}
