syntax = "proto3";

import "FeedContentIcon.proto";
import "FeedContentResource.proto";
import "FeedHeadButton.proto";
import "FeedKV.proto";

message FeedDownloadComponent {
    FeedContentIcon icon = 1;
    repeated FeedContentResource title = 2;
    repeated FeedContentResource desc = 3;
    repeated FeedContentResource sub_desc = 4;
    FeedHeadButton button = 5;
    string schema = 6;
    repeated FeedKV business_info = 7;
}
