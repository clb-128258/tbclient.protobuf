syntax = "proto3";

import "PicDecoration.proto";
import "ThumbnailInfo.proto";

message VideoField {
    string url = 1;
    uint32 duration = 2;
    uint32 width = 3;
    uint32 height = 4;
    uint32 play_count = 5;
    ThumbnailInfo thumbnail = 6;
    int32 is_vertical = 7;
    string md5 = 8;
    ThumbnailInfo first_frame_thumbnail = 9;
    repeated PicDecoration decoration = 10;
    int32 is_hide = 11;
    int32 is_hide_play_btn = 12;
}
