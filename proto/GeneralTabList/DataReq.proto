syntax = "proto3";

import "CommonReq.proto";

message DataReq {
    CommonReq common = 1;
    int32 tab_id = 2;
    int64 forum_id = 3;
    int32 pn = 4;
    int32 rn = 5;
    int32 scr_w = 6;
    int32 scr_h = 7;
    int32 scr_dip = 8;
    int64 last_thread_id = 9;
    int32 is_default_navtab = 10;
    string tab_name = 11;
    int32 is_general_tab = 12;
    int32 sort_type = 13;
    int32 tab_type = 14;
    string ad_ext_params = 15;
    string ad_bear_context = 16;
    int32 has_ad_bear = 17;
    string ad_bear_sid = 18;
    double ad_bear_sid_price = 19;
    int32 request_times = 20;
    string frs_common_info = 21;
    int32 is_newfrs = 22;
    int32 is_video_doublerow = 23;
    string top_card_id = 25;
    string log_param = 26;
    uint32 is_newfeed = 27;
    string frs_tab_type_default = 28;
    string forum_name = 29;
    int32 partition_type = 30;
    uint64 tid_src = 31;
    string nid_src = 32;
    string ad_external_info = 35;
