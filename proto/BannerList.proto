syntax = "proto3";

import "AdAuditInfo.proto";
import "App.proto";
import "FeedForumInfo.proto";
import "RecomTopicInfo.proto";

message BannerList {
    repeated App app = 1;
    repeated FeedForumInfo feed_forum = 2;
    RecomTopicInfo hot_topic = 3;
    string applist = 4;
    App pb_banner_ad = 5;
    repeated App video_recommend_ad = 6;
    repeated App comment_game_ad = 7;
    AdAuditInfo ad_audit_info = 8;
    AdAuditInfo pb_banner_ad_audit_info = 9;
}
