syntax = "proto3";

import "ComponentFactory.proto";
import "FeedContentIcon.proto";
import "FeedKV.proto";

message HotTopicCardLayout {
    repeated ComponentFactory components = 1;
    repeated FeedKV business_info = 2;
    repeated FeedKV log_param = 3;
    string schema = 4;
    repeated string prefetch_schema = 5;
    FeedContentIcon background = 7;
    repeated FeedKV log_info = 8;
}
