syntax = "proto3";

import "FrsBottomActivityTime.proto";
import "SponsorForumInfo.proto";

message FrsBottomActivity {
    string title = 1;
    string _abstract = 2;
    string image = 3;
    string icon = 4;
    string jump_url = 5;
    FrsBottomActivityTime activity_time = 6;
    int32 type = 7;
    SponsorForumInfo sponsor_forum = 8;
    string color = 9;
}
