syntax = "proto3";

import "OfficialActivityInfo.proto";

message OfficialRecomCard {
    uint64 fid = 1;
    string fname = 2;
    string avatar = 3;
    string desc = 4;
    string background = 5;
    string scheme = 6;
    OfficialActivityInfo activity = 7;
    uint32 insert_floor = 8;
    uint32 is_like = 9;
    uint64 recom_fid = 10;
}
